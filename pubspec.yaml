flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/logo3.jpg"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icons/logo3.jpg" # android min sdk min:16, default 21
  web:
    generate: true
    image_path: "assets/icons/logo3.jpg"
    background_color: "#000000"
    theme_color: "#hexcode"
    

